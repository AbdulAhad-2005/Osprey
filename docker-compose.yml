services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-pentest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pentest}
      POSTGRES_USER: ${POSTGRES_USER:-pentest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pentest}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pentest} -d ${POSTGRES_DB:-pentest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kali-tools:
    build:
      context: ./kali-tools
    container_name: ai-pentest-kali
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - ./mcp-servers:/home/mcpuser/mcp-servers
    stdin_open: true
    tty: true
    healthcheck:
      # nmap (apt) + subfinder (Go) — catches PATH / missing-tool regressions
      test: ["CMD-SHELL", "command -v nmap && command -v subfinder"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend:
    build:
      context: ./backend
    container_name: ai-pentest-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://pentest:pentest@postgres:5432/pentest}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      KALI_CONTAINER: ai-pentest-kali
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-300}
      LLM_MAX_AGENT_TURNS: ${LLM_MAX_AGENT_TURNS:-40}
      LLM_TOOL_TIMEOUT: ${LLM_TOOL_TIMEOUT:-900}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./config:/config
      - ./skills:/skills
      - ./mcp-servers:/mcp-servers
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "pentest_platform.main:app", "--host", "0.0.0.0", "--port", "9000"]
    depends_on:
      postgres:
        condition: service_healthy
      kali-tools:
        condition: service_healthy

volumes:
  postgres_data:
