# Finalize / report trust — referee rules. Config owns gates; LLM owns narrative.
# Prefer soft signals over hard traps. Tune here — do not grow AGENTS.

# Soft by default: hypothesis attack-paths show as warnings, not COMPLETE blocks.
# Set true only if you want a hard gate when hyp edges exist without observed HIGH.
block_hypothesis_only_paths: false

# Used only when block_hypothesis_only_paths is true.
min_observed_high_when_hyp_paths: 1

# Evidence snippet length for "strong observed".
min_strong_evidence_chars: 80

strong_evidence_markers:
  - "http/"
  - "banner"
  - "set-cookie"
  - "www-authenticate"
  - "openssh"
  - "server:"
  - "content-type: application/json"

outline_per_section: 25
