# Multi-agent phase pipeline configuration.
#
# The phase supervisor is a deterministic conductor: it spawns a phase agent,
# and as soon as an upstream phase has produced ENOUGH data (not "finished"), it
# spawns the downstream phase agent CONCURRENTLY — recon, vuln and exploit can
# all be running at once.
#
# "Enough" used to be a finding-count threshold table here (requires_any).
# plans/harness/06-prioritization-engine.md Step 4 retired that: a downstream
# phase now unlocks when config/priority.yaml's phase_thresholds are crossed
# by a real multi-factor priority score (services/priority.py), not a count —
# see phase_thresholds/phase_item_types in that file.

# Feedback loop: when a finding of one of these types appears during a LATER
# phase (e.g. vuln discovers a new host), recon is re-opened for it.
recon_reopen_on:
  - subdomain
  - host

# Lifecycle / safety
max_agents_per_phase: 3            # concurrent agents the supervisor runs per phase
# Hard wall for a whole pipeline run — NOT the primary stop condition (that's
# investigation_director.run_agent_driven_pipeline's own fixpoint: no active
# agents AND no new findings for stable_polls_to_finish consecutive polls,
# checked every supervisor_poll_seconds regardless of this value). This is
# only the safety backstop for a run that genuinely never settles. 3600s (1
# hour) made autonomous, unattended operation on a real target structurally
# impossible — a large engagement's genuine recon/vuln/exploit work can
# legitimately take far longer than that while still being productive.
# 86400s (24h) as the default; raise further in config for a real multi-day
# unattended campaign.
pipeline_time_budget_seconds: 86400
supervisor_poll_seconds: 8         # how often the conductor re-evaluates triggers
