# Cross-finding correlation — READ-ONLY matching logic.
# These rules drive finding_correlator.find_correlations, which only *suggests*
# candidate links on demand. Nothing here is ever auto-written to the graph;
# the LLM confirms the useful ones via platform_graph_link.

correlations:
  - id: likely_same_app
    type: same_ip_similar_title
    relation: likely_same_app
    confidence: likely
    min_title_token_overlap: 0.5
    min_title_len: 4
    max_links_per_run: 12
    # Shared-infra guard: skip any IP carrying more than this many hosts — on a
    # CDN / shared-hosting block, sharing an address is not evidence of one app.
    max_hosts_per_ip: 6
    tag: correlated_same_app

  - id: shares_auth
    type: shared_cookie_domain
    relation: shares_auth
    confidence: likely
    max_links_per_run: 8
    tag: correlated_auth
