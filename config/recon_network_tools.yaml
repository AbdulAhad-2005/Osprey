# Recon + network tool capabilities for the Commander LLM.
# Skills live in skills/recon/ and skills/network/.
# LLM may pass ANY flags via additional_args — not limited to examples below.

tasks:
  subdomain_enumeration:
    phase: recon
    description: Discover subdomains for a root domain (passive first).
    default_tool: subfinder_scan
    alternatives: [amass_scan, fierce_scan, dnsenum_scan]
    skill_file: recon/subdomain-enumeration.md
    produces: [subdomain, observation]

  live_host_probing:
    phase: recon
    description: Probe which hosts/URLs respond over HTTP(S) and fingerprint tech.
    default_tool: httpx_probe
    alternatives: []
    skill_file: recon/live-host-probing.md
    produces: [host, url, technology]

  historical_url_discovery:
    phase: recon
    description: Find historical URLs from archives and OSINT sources.
    default_tool: waybackurls_discovery
    alternatives: [gau_discovery]
    skill_file: recon/historical-url-discovery.md
    produces: [url, observation]

  web_crawling:
    phase: recon
    description: Crawl a target URL for endpoints and forms.
    default_tool: hakrawler_crawl
    alternatives: []
    skill_file: recon/web-crawling.md
    produces: [url, observation]

  dns_intelligence:
    phase: recon
    description: DNS enumeration, zone transfer attempts, IP range discovery.
    default_tool: dnsenum_scan
    alternatives: [fierce_scan]
    skill_file: recon/dns-intelligence.md
    produces: [host, observation]

  sister_domain_discovery:
    phase: recon
    description: Find sister/affiliated root domains (subsidiaries, sibling brands, shared infra) for a seed domain via OSINT.
    default_tool: domain_hunter
    alternatives: [amass_scan]
    skill_file: shared/sister-domain-discovery.md
    produces: [host, subdomain, observation]

  dns_resolution:
    phase: recon
    description: Bulk-resolve hostnames to IPs / CNAMEs (when you need structured DNS at scale).
    default_tool: dnsx_resolve
    alternatives: [fierce_scan, dnsenum_scan]
    skill_file: recon/dns-intelligence.md
    produces: [host, observation]

  reverse_dns_lookup:
    phase: recon
    description: Reverse-resolve IPs (PTR) to surface co-located hostnames / virtual hosts. Each PTR name is a new seed.
    default_tool: dnsx_reverse
    alternatives: [dnsx_resolve]
    skill_file: recon/asset-discovery-breadth.md
    produces: [subdomain, observation]

  asn_netblock_enumeration:
    phase: recon
    description: Map an IP to its ASN + BGP prefix (Team Cymru), or list an ASN's announced prefixes (RADb). Expands scope to the org's full IP footprint.
    default_tool: asn_enum
    alternatives: [whois_lookup]
    skill_file: recon/asset-discovery-breadth.md
    produces: [observation]

  tls_certificate_intel:
    phase: recon
    description: Inspect TLS certs / SANs (optional CDN hints). Use when HTTPS hosts matter.
    default_tool: tlsx_inspect
    alternatives: [httpx_probe]
    skill_file: recon/ip-attribution.md
    produces: [observation, subdomain, technology]

  ct_subdomain_discovery:
    phase: recon
    description: Passive Certificate Transparency (crt.sh) for more hostnames.
    default_tool: crt_sh_query
    alternatives: [subfinder_scan]
    skill_file: recon/subdomain-enumeration.md
    produces: [subdomain]

  cdn_origin_clues:
    phase: recon
    description: Soft CDN/origin clues (dig+curl). Advisory — confirm before scanning edge IPs.
    default_tool: cdn_origin_probe
    alternatives: [origin_ip_attribution, dnsx_resolve, tlsx_inspect]
    skill_file: recon/ip-attribution.md
    produces: [host, technology, observation]

  technology_identification:
    phase: recon
    description: Identify web technologies (CMS, frameworks, servers, JS libs, analytics) via fingerprinting tools.
    default_tool: whatweb_scan
    alternatives: [wappalyzer_scan, tech_stack_analyze, httpx_probe]
    skill_file: recon/technology-identification.md
    produces: [technology, observation]
  passive_internet_osint:
    phase: recon
    description: Passive internet-wide OSINT via Shodan (search + host detail). Needs SHODAN_API_KEY.
    default_tool: shodan_search
    alternatives: [shodan_host_info]
    skill_file: recon/passive-osint-shodan.md
    produces: [host, port, subdomain, observation]

  subdomain_takeover:
    phase: recon
    description: Check discovered hosts for dangling CNAME / unclaimed SaaS takeover fingerprints.
    default_tool: subdomain_takeover_check
    alternatives: [dnsx_resolve]
    skill_file: recon/subdomain-takeover.md
    produces: [observation]

  content_discovery:
    phase: recon
    description: Brute-force / fuzz for hidden paths, files and directories on a live host.
    default_tool: feroxbuster_scan
    alternatives: [ffuf_scan, gobuster_scan]
    skill_file: recon/content-and-js-recon.md
    produces: [url, observation]

  parameter_discovery:
    phase: recon
    description: Find hidden HTTP parameters (injection-point candidates) on live endpoints.
    default_tool: arjun_scan
    alternatives: [x8_parameter_discovery, katana_crawl]
    skill_file: recon/content-and-js-recon.md
    produces: [observation]

  javascript_analysis:
    phase: recon
    description: Mine a page's JavaScript for endpoints, hardcoded secrets and cloud storage refs.
    default_tool: js_recon
    alternatives: [katana_crawl]
    skill_file: recon/javascript-recon.md
    produces: [url, observation]

  web_crawling_deep:
    phase: recon
    description: JS-aware crawl to enumerate endpoints and forms across an app.
    default_tool: katana_crawl
    alternatives: [hakrawler_crawl]
    skill_file: recon/content-and-js-recon.md
    produces: [url, observation]

  spa_render_scrape:
    phase: recon
    description: Render a JS/SPA app in a real browser to extract client-side routes, runtime XHR/fetch API endpoints, and forms static crawlers miss.
    default_tool: browser_scrape
    alternatives: [katana_crawl]
    skill_file: web/browser-automation.md
    produces: [url, observation]

  email_security_posture:
    phase: recon
    description: Assess SPF / DKIM / DMARC / MX anti-spoofing posture for a domain.
    default_tool: email_security_probe
    alternatives: []
    skill_file: recon/content-and-js-recon.md
    produces: [observation]

  policy_file_discovery:
    phase: recon
    description: Fetch robots.txt / sitemap.xml / .well-known/* and extract disallowed paths and endpoints.
    default_tool: well_known_probe
    alternatives: []
    skill_file: recon/content-and-js-recon.md
    produces: [url, observation]

  port_discovery:
    phase: network
    description: Fast discovery of open TCP ports on a host.
    default_tool: naabu_port_scan
    alternatives: [rustscan_fast_scan, masscan_high_speed, nmap_syn_scan]
    skill_file: network/port-scan-strategy.md
    produces: [port, host]

  service_enumeration:
    phase: network
    description: Identify services and versions on known open ports.
    default_tool: nmap_service_scan
    alternatives: [nmap_syn_scan, nmap_custom_scan]
    skill_file: network/service-enumeration.md
    produces: [service, port]

  smb_enumeration:
    phase: network
    description: Enumerate SMB/NetBIOS when ports 445/139 are open.
    default_tool: enum4linux_scan
    alternatives: [smbmap_scan, enum4linux_ng_advanced, netexec_scan]
    skill_file: network/smb-enumeration.md
    produces: [service, observation]

tools:
  subfinder_scan:
    task: subdomain_enumeration
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    alternatives: [amass_scan, fierce_scan, dnsenum_scan]
    llm_hints: |
      Default passive subdomain enum. If few results, try amass with additional_args "-passive" or fierce.
    parameters:
      domain: { type: string, required: true, description: "Root domain" }
      silent: { type: bool, default: true }
      all_sources: { type: bool, default: false }
    example_calls:
      - { domain: "example.com" }
      - { domain: "example.com", additional_args: "-all" }

  amass_scan:
    task: subdomain_enumeration
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Deeper subdomain enum. mode=enum (default) or mode=passive for passive-only.
      Do not use mode=passive as a top-level command — passive runs via enum -passive.
    parameters:
      domain: { type: string, required: true }
      mode: { type: string, default: enum }

  fierce_scan:
    task: subdomain_enumeration
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      domain: { type: string, required: true }

  dnsenum_scan:
    task: dns_intelligence
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      domain: { type: string, required: true }
      dns_server: { type: string, default: "" }

  httpx_probe:
    task: live_host_probing
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Run after subdomain enum. Pass one URL/host OR many hosts separated by newlines
      (or commas) in target — bulk lists are written to a temp file and run with httpx -l.
      Prefer batches of ~50–150 hosts per call (or platform_script for 400+ with chunking).
      Do NOT fall back to one-host-at-a-time after a failure — chunk and retry.
      Enable tech_detect for stack fingerprinting. Extra flags via additional_args.
    parameters:
      target: { type: string, required: true, description: "URL, domain, or newline/comma-separated host list" }
      tech_detect: { type: bool, default: false }
      status_code: { type: bool, default: false }
      title: { type: bool, default: false }
      threads: { type: int, default: 50 }

  waybackurls_discovery:
    task: historical_url_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      domain: { type: string, required: true }

  gau_discovery:
    task: historical_url_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      domain: { type: string, required: true }
      providers: { type: string, default: "wayback,commoncrawl,otx,urlscan" }

  hakrawler_crawl:
    task: web_crawling
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      url: { type: string, required: true }
      depth: { type: int, default: 2 }
      forms: { type: bool, default: true }

  anew_data_processing:
    task: subdomain_enumeration
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: Utility for deduplicating line-based tool output — not a scanner.
    parameters:
      input_data: { type: string, required: true }
      output_file: { type: string, default: "" }

  domain_hunter:
    task: sister_domain_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Finds OTHER root domains owned/affiliated with the seed org (sister/subsidiary/brand
      domains), NOT subdomains — run subfinder for subdomains. Free by default; every hit
      cites its evidence, method, confidence (low/medium/high) and whether it is live.
      Pass a bare root domain in `domain`. Narrow with `modules` (e.g. certs,dns,asn,
      whois,knowledge_recon,site_scrape) or raise `confidence_min` to medium/high to cut noise.
      Each discovered domain is fed back to the graph — pivot by running subfinder/httpx on
      high-confidence live siblings.
    parameters:
      domain: { type: string, required: true, description: "Seed root domain" }
      modules: { type: string, default: "", description: "Comma-separated module subset" }
      confidence_min: { type: string, default: "low", description: "low/medium/high" }
    example_calls:
      - { domain: "example.com" }
      - { domain: "example.com", confidence_min: "medium" }
      - { domain: "example.com", modules: "certs,dns,asn,knowledge_recon" }

  dnsx_resolve:
    task: dns_resolution
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Bulk resolve hosts to IPs/CNAMEs. Pass target= as one host or newline/comma list.
    parameters:
      target: { type: string, required: true, description: "Host(s), newline or comma separated" }
      record_types: { type: string, default: "a,aaaa,cname,ns,mx" }

  tlsx_inspect:
    task: tls_certificate_intel
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      target: { type: string, required: true }
      port: { type: string, default: "443" }

  crt_sh_query:
    task: ct_subdomain_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      domain: { type: string, required: true }
      include_subdomains: { type: bool, default: true }

  cdn_origin_probe:
    task: cdn_origin_clues
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Soft CDN/origin clues. Confirm candidates before scanning edge IPs. Not mandatory.
    parameters:
      domain: { type: string, required: true }
      timeout: { type: string, default: "20" }

  origin_ip_attribution:
    task: cdn_origin_clues
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Full origin IP attribution pipeline. Uses CIDR-based CDN classification, HTTP header
      detection, MX/SPF/subdomain probing, and direct IP verification. Best when you need
      confirmed origin candidates with confidence scores. Slower than cdn_origin_probe.
    parameters:
      domain: { type: string, required: true }
      live_hosts: { type: string, default: "" }
      timeout: { type: int, default: 30 }

  # cloudflare_origin_ip / cdn_origin_ip removed as duplicates of cdn_origin_probe.
  # Fast clue-gathering: cdn_origin_probe. Deep pipeline: origin_ip_attribution.

  shodan_search:
    task: passive_internet_osint
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Passive only. Prefer hostname:<domain>, ssl:<domain>, org:"Name". Not a live port scan —
      verify interesting ports with naabu/nmap. Needs SHODAN_API_KEY.
    parameters:
      query: { type: string, required: false }
      domain: { type: string, required: false }
      limit: { type: int, default: 20 }

  shodan_host_info:
    task: passive_internet_osint
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Deepen a specific IP from Shodan/search/dnsx. Vuln tags are leads — verify before claiming.
    parameters:
      ip: { type: string, required: false }
      target: { type: string, required: false }

  subdomain_takeover_check:
    task: subdomain_takeover
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      After subdomain inventory: mode=list with subdomains= host list. Fingerprint match ≠
      proven takeover — confirm claimability before HIGH severity. Chunk >50 hosts via jobs.
    parameters:
      target: { type: string, required: false }
      mode: { type: string, default: "single" }
      subdomains: { type: string, required: false }
      max_hosts: { type: int, default: 50 }

  rustscan_fast_scan:
    task: port_discovery
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Fast alternative when naabu missing. Use additional_args for batch/ulimit.
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "" }
      batch_size: { type: int, default: 1000 }

  naabu_port_scan:
    task: port_discovery
    phase: network
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Preferred fast discovery. Default top_ports=1000. Prefer known opens / top ports over
      full-range. Full 1-65535 — ask human first (same budget discipline as masscan).
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "" }
      top_ports: { type: string, default: "1000" }
      rate: { type: int, default: 1000 }

  masscan_high_speed:
    task: port_discovery
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Default ports=1-1000. Full 1-65535 blocked unless human OK + confirm_expensive=true.
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "1-1000" }
      rate: { type: int, default: 1000 }
      banners: { type: bool, default: false }
      confirm_expensive: { type: bool, default: false }

  nmap_syn_scan:
    task: port_discovery
    phase: network
    freeform_args_field: extra_args
    default_for_task: false
    llm_hints: |
      Runs as unprivileged TCP connect scan (-sT -Pn) in this environment unless privileged=true.
      Empty ports = nmap defaults (top ~1000) — preferred. Prefer --top-ports 1000 or ports=1-1000.
      NEVER use ports=1-65535 / -p- unless the human operator explicitly approved; then pass
      confirm_expensive=true. On timeout: shrink to one IP + known/web ports, use jobs — do not widen.
      Prefer one IP per call (or platform_script / jobs to chunk IPs).
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "" }
      timing: { type: string, default: "" }
      confirm_expensive: { type: bool, default: false }

  nmap_service_scan:
    task: service_enumeration
    phase: network
    freeform_args_field: extra_args
    default_for_task: true
    llm_hints: |
      Version + default scripts. Prefer focused port list. extra_args/additional_args for -Pn, -T2, --script, etc.
      ports param: comma-separated numbers ONLY (e.g. 22,80,443) — do NOT include -p in ports.
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "" }

  nmap_custom_scan:
    task: service_enumeration
    phase: network
    freeform_args_field: flags
    default_for_task: false
    llm_hints: |
      Escape hatch — pass nmap flags in flags= or additional_args=.
      target= is required; flags default to safe connect scan if omitted.
    parameters:
      target: { type: string, required: true }
      flags: { type: string, required: false, default: "-sT -Pn --unprivileged", description: "Nmap flag string" }
      privileged: { type: bool, default: false }

  enum4linux_scan:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      target: { type: string, required: true }
      additional_args: { type: string, default: "-a" }

  enum4linux_ng_advanced:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      shares: { type: bool, default: true }
      users: { type: bool, default: true }

  smbmap_scan:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      username: { type: string, default: "" }
      password: { type: string, default: "" }

  netexec_scan:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      protocol: { type: string, default: smb }

  nbtscan_netbios:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Requires a literal IPv4 — use RESOLVED_IP from context, not the hostname.
    parameters:
      target: { type: string, required: true, description: "IPv4 address (not hostname)" }

  arp_scan_discovery:
    task: port_discovery
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: Local network only — L2 ARP, requires being on the same broadcast domain as the target; will not work against a remote/internet target.
    parameters:
      target: { type: string, required: true }

  autorecon_scan:
    task: service_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: Heavy automated bundle (all scanners) — use when narrower scans are insufficient.
    parameters:
      target: { type: string, required: true }
      output_dir: { type: string, default: "/tmp/autorecon" }

  rpcclient_enumeration:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      commands: { type: string, default: "enumdomusers;enumdomgroups;querydominfo" }

  responder_credential_harvest:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: GATED — requires allow_exploitation in engagement RoE. Also LAN-only (LLMNR/NBT-NS poisoning requires being on the same local network segment as the victim); will not work against a remote/internet target.
    parameters:
      interface: { type: string, default: eth0 }
      analyze: { type: bool, default: false }

  # ---- Technology Identification ----

  whatweb_scan:
    task: technology_identification
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Comprehensive web fingerprinting via WhatWeb. Identifies CMS, frameworks, JS libraries,
      web servers, and 1800+ plugins. aggression=1 (passive, default) is safe; 2-4 are aggressive.
      Output is JSON — parse for technology names and versions. Combine with wappalyzer_scan for
      cross-validation. After detection, use tech_dispatch signals for follow-up probes.
    parameters:
      target: { type: string, required: true, description: "Target URL or domain" }
      aggression: { type: string, default: "1", description: "Detection level (1-4)" }
      verbose: { type: bool, default: false }
    example_calls:
      - { target: "https://example.com" }
      - { target: "example.com", aggression: "2" }

  wappalyzer_scan:
    task: technology_identification
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Python-Wappalyzer based detection. Categorizes technologies by type (CMS, framework,
      JS library, analytics, CDN, etc.). Good for version detection. Use as alternative or
      complement to whatweb_scan. Cross-validate findings from both tools.
    parameters:
      target: { type: string, required: true, description: "Target URL or domain" }
    example_calls:
      - { target: "https://example.com" }

  tech_stack_analyze:
    task: technology_identification
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      All-in-one analysis: runs WhatWeb + Wappalyzer + HTTP header analysis. Produces unified
      technology stack with security concerns and follow-up recommendations. Slower than
      individual tools. Use when you want a comprehensive report in one call.
    parameters:
      target: { type: string, required: true, description: "Target URL or domain" }
      aggression: { type: string, default: "1" }
      verbose: { type: bool, default: false }
    example_calls:
      - { target: "https://example.com" }

  # ---- Active recon: content / parameter / JS / policy ----

  feroxbuster_scan:
    task: content_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Recursive content discovery on a LIVE host (url=). Auto-tunes away soft-404 noise.
      Raise depth= for recursion; add extensions with additional_args "-x php,txt,bak,zip".
      Run after httpx confirms the host is live. Chunk big wordlists via jobs.
    parameters:
      url: { type: string, required: true, description: "Target URL (http/https)" }
      wordlist: { type: string, default: "" }
      threads: { type: int, default: 40 }
      depth: { type: int, default: 1 }

  ffuf_scan:
    task: content_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      One coherent fuzz per call. mode=directory (paths), mode=vhost (Host-header virtual hosts —
      use when many names share one IP), mode=parameter (hidden query params). Emits NDJSON.
    parameters:
      url: { type: string, required: true }
      mode: { type: string, default: "directory", description: "directory|vhost|parameter" }
      wordlist: { type: string, default: "" }
      match_codes: { type: string, default: "200,204,301,302,307,401,403,405" }

  gobuster_scan:
    task: content_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: "Alternative to feroxbuster. mode=dir|dns|vhost. url= required (dir/vhost)."
    parameters:
      url: { type: string, required: true }
      mode: { type: string, default: "dir" }
      wordlist: { type: string, default: "" }

  arjun_scan:
    task: parameter_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Active hidden-parameter discovery on ONE live endpoint (url=, method=GET/POST). Found
      params are injection-point candidates — feed them to the vuln phase, don't test here.
    parameters:
      url: { type: string, required: true }
      method: { type: string, default: "GET" }
      threads: { type: int, default: 25 }

  katana_crawl:
    task: web_crawling_deep
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      JS-aware crawler (url=). Follows links AND parses JavaScript for endpoints; the parser
      also mines query parameters from every crawled URL. Prefer over hakrawler for SPA/API apps.
    parameters:
      url: { type: string, required: true }
      depth: { type: int, default: 3 }

  js_recon:
    task: javascript_analysis
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Point at a page or a JS URL (target=). Extracts endpoints/API paths, hardcoded secrets
      (API keys, tokens, JWTs, private keys) and exposed cloud storage. On SPA/API targets the
      real surface lives in the JS bundles — run this on every live app host. Secrets are
      exposure-observed but validity-UNVERIFIED: confirm before any HIGH claim.
    parameters:
      target: { type: string, required: true, description: "Page URL, JS URL, or list" }
      max_files: { type: int, default: 40 }
      timeout: { type: int, default: 15 }

  email_security_probe:
    task: email_security_posture
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: "Passive DNS: SPF/DKIM/DMARC/MX (domain=). Missing SPF/DMARC = spoofing exposure."
    parameters:
      domain: { type: string, required: true }

  well_known_probe:
    task: policy_file_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Fetch robots.txt / sitemap.xml / .well-known/* (url=/domain=). Extracts Disallow paths
      (often-sensitive), sitemap URLs, security.txt and OIDC/SSO endpoints as leads.
    parameters:
      url: { type: string, required: true, description: "Target URL or domain" }
      timeout: { type: int, default: 12 }
