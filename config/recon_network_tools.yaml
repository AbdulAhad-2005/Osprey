# Recon + network tool capabilities for the Commander LLM.
# Skills live in skills/recon/ and skills/network/.
# LLM may pass ANY flags via additional_args — not limited to examples below.

tasks:
  subdomain_enumeration:
    phase: recon
    description: Discover subdomains for a root domain (passive first).
    default_tool: subfinder_scan
    alternatives: [amass_scan, fierce_scan, dnsenum_scan]
    skill_file: recon/subdomain-enumeration.md
    produces: [subdomain, observation]

  live_host_probing:
    phase: recon
    description: Probe which hosts/URLs respond over HTTP(S) and fingerprint tech.
    default_tool: httpx_probe
    alternatives: []
    skill_file: recon/live-host-probing.md
    produces: [host, url, technology]

  historical_url_discovery:
    phase: recon
    description: Find historical URLs from archives and OSINT sources.
    default_tool: waybackurls_discovery
    alternatives: [gau_discovery]
    skill_file: recon/historical-url-discovery.md
    produces: [url, observation]

  web_crawling:
    phase: recon
    description: Crawl a target URL for endpoints and forms.
    default_tool: hakrawler_crawl
    alternatives: []
    skill_file: recon/web-crawling.md
    produces: [url, observation]

  dns_intelligence:
    phase: recon
    description: DNS enumeration, zone transfer attempts, IP range discovery.
    default_tool: dnsenum_scan
    alternatives: [fierce_scan]
    skill_file: recon/dns-intelligence.md
    produces: [host, observation]

  sister_domain_discovery:
    phase: recon
    description: Find sister/affiliated root domains (subsidiaries, sibling brands, shared infra) for a seed domain via OSINT.
    default_tool: domain_hunter
    alternatives: [amass_scan]
    skill_file: shared/sister-domain-discovery.md
    produces: [host, subdomain, observation]

  dns_resolution:
    phase: recon
    description: Bulk-resolve hostnames to IPs / CNAMEs (when you need structured DNS at scale).
    default_tool: dnsx_resolve
    alternatives: [fierce_scan, dnsenum_scan]
    skill_file: recon/dns-intelligence.md
    produces: [host, observation]

  tls_certificate_intel:
    phase: recon
    description: Inspect TLS certs / SANs (optional CDN hints). Use when HTTPS hosts matter.
    default_tool: tlsx_inspect
    alternatives: [httpx_probe]
    skill_file: recon/ip-attribution.md
    produces: [observation, subdomain, technology]

  ct_subdomain_discovery:
    phase: recon
    description: Passive Certificate Transparency (crt.sh) for more hostnames.
    default_tool: crt_sh_query
    alternatives: [subfinder_scan]
    skill_file: recon/subdomain-enumeration.md
    produces: [subdomain]

  cdn_origin_clues:
    phase: recon
    description: Soft CDN/origin clues (dig+curl). Advisory — confirm before scanning edge IPs.
    default_tool: cdn_origin_probe
    alternatives: [dnsx_resolve, tlsx_inspect]
    skill_file: recon/ip-attribution.md
    produces: [host, technology, observation]

  port_discovery:
    phase: network
    description: Fast discovery of open TCP ports on a host.
    default_tool: rustscan_fast_scan
    alternatives: [masscan_high_speed, nmap_syn_scan]
    skill_file: network/port-scan-strategy.md
    produces: [port, host]

  service_enumeration:
    phase: network
    description: Identify services and versions on known open ports.
    default_tool: nmap_service_scan
    alternatives: [nmap_syn_scan, nmap_custom_scan]
    skill_file: network/service-enumeration.md
    produces: [service, port]

  smb_enumeration:
    phase: network
    description: Enumerate SMB/NetBIOS when ports 445/139 are open.
    default_tool: enum4linux_scan
    alternatives: [smbmap_scan, enum4linux_ng_advanced, netexec_scan]
    skill_file: network/smb-enumeration.md
    produces: [service, observation]

tools:
  subfinder_scan:
    task: subdomain_enumeration
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    alternatives: [amass_scan, fierce_scan, dnsenum_scan]
    llm_hints: |
      Default passive subdomain enum. If few results, try amass with additional_args "-passive" or fierce.
    parameters:
      domain: { type: string, required: true, description: "Root domain" }
      silent: { type: bool, default: true }
      all_sources: { type: bool, default: false }
    example_calls:
      - { domain: "example.com" }
      - { domain: "example.com", additional_args: "-all" }

  amass_scan:
    task: subdomain_enumeration
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Deeper subdomain enum. mode=enum (default) or mode=passive for passive-only.
      Do not use mode=passive as a top-level command — passive runs via enum -passive.
    parameters:
      domain: { type: string, required: true }
      mode: { type: string, default: enum }

  fierce_scan:
    task: subdomain_enumeration
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      domain: { type: string, required: true }

  dnsenum_scan:
    task: dns_intelligence
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      domain: { type: string, required: true }
      dns_server: { type: string, default: "" }

  httpx_probe:
    task: live_host_probing
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Run after subdomain enum. Pass one URL/host OR many hosts separated by newlines
      (or commas) in target — bulk lists are written to a temp file and run with httpx -l.
      Prefer batches of ~50–150 hosts per call (or platform_script for 400+ with chunking).
      Do NOT fall back to one-host-at-a-time after a failure — chunk and retry.
      Enable tech_detect for stack fingerprinting. Extra flags via additional_args.
    parameters:
      target: { type: string, required: true, description: "URL, domain, or newline/comma-separated host list" }
      tech_detect: { type: bool, default: false }
      status_code: { type: bool, default: false }
      title: { type: bool, default: false }
      threads: { type: int, default: 50 }

  waybackurls_discovery:
    task: historical_url_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      domain: { type: string, required: true }

  gau_discovery:
    task: historical_url_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      domain: { type: string, required: true }
      providers: { type: string, default: "wayback,commoncrawl,otx,urlscan" }

  hakrawler_crawl:
    task: web_crawling
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      url: { type: string, required: true }
      depth: { type: int, default: 2 }
      forms: { type: bool, default: true }

  anew_data_processing:
    task: subdomain_enumeration
    phase: recon
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: Utility for deduplicating line-based tool output — not a scanner.
    parameters:
      input_data: { type: string, required: true }
      output_file: { type: string, default: "" }

  domain_hunter:
    task: sister_domain_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Finds OTHER root domains owned/affiliated with the seed org (sister/subsidiary/brand
      domains), NOT subdomains — run subfinder for subdomains. Free by default; every hit
      cites its evidence, method, confidence (low/medium/high) and whether it is live.
      Pass a bare root domain in `domain`. Narrow with `modules` (e.g. certs,dns,asn,
      knowledge_recon,site_scrape) or raise `confidence_min` to medium/high to cut noise.
      Each discovered domain is fed back to the graph — pivot by running subfinder/httpx on
      high-confidence live siblings.
    parameters:
      domain: { type: string, required: true, description: "Seed root domain" }
      modules: { type: string, default: "", description: "Comma-separated module subset" }
      confidence_min: { type: string, default: "low", description: "low/medium/high" }
    example_calls:
      - { domain: "example.com" }
      - { domain: "example.com", confidence_min: "medium" }
      - { domain: "example.com", modules: "certs,dns,asn,knowledge_recon" }

  dnsx_resolve:
    task: dns_resolution
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Bulk resolve hosts to IPs/CNAMEs. Pass target= as one host or newline/comma list.
    parameters:
      target: { type: string, required: true, description: "Host(s), newline or comma separated" }
      record_types: { type: string, default: "a,aaaa,cname,ns,mx" }

  tlsx_inspect:
    task: tls_certificate_intel
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      target: { type: string, required: true }
      port: { type: string, default: "443" }

  crt_sh_query:
    task: ct_subdomain_discovery
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      domain: { type: string, required: true }
      include_subdomains: { type: bool, default: true }

  cdn_origin_probe:
    task: cdn_origin_clues
    phase: recon
    freeform_args_field: additional_args
    default_for_task: true
    llm_hints: |
      Soft CDN/origin clues. Confirm candidates before scanning edge IPs. Not mandatory.
    parameters:
      domain: { type: string, required: true }
      timeout: { type: string, default: "20" }

  rustscan_fast_scan:
    task: port_discovery
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Not installed in this environment. Use nmap_custom_scan or masscan_high_speed instead.
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "" }
      batch_size: { type: int, default: 4500 }

  masscan_high_speed:
    task: port_discovery
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Default ports=1-1000. Full 1-65535 blocked unless human OK + confirm_expensive=true.
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "1-1000" }
      rate: { type: int, default: 1000 }
      banners: { type: bool, default: false }
      confirm_expensive: { type: bool, default: false }

  nmap_syn_scan:
    task: port_discovery
    phase: network
    freeform_args_field: extra_args
    default_for_task: false
    llm_hints: |
      Runs as unprivileged TCP connect scan (-sT -Pn) in this environment unless privileged=true.
      Empty ports = nmap defaults (top ~1000) — preferred. Prefer --top-ports 1000 or ports=1-1000.
      NEVER use ports=1-65535 / -p- unless the human operator explicitly approved; then pass
      confirm_expensive=true. On timeout: shrink to one IP + known/web ports, use jobs — do not widen.
      Prefer one IP per call (or platform_script / jobs to chunk IPs).
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "" }
      timing: { type: string, default: "" }
      confirm_expensive: { type: bool, default: false }

  nmap_service_scan:
    task: service_enumeration
    phase: network
    freeform_args_field: extra_args
    default_for_task: true
    llm_hints: |
      Version + default scripts. Prefer focused port list. extra_args/additional_args for -Pn, -T2, --script, etc.
      ports param: comma-separated numbers ONLY (e.g. 22,80,443) — do NOT include -p in ports.
    parameters:
      target: { type: string, required: true }
      ports: { type: string, default: "" }

  nmap_custom_scan:
    task: service_enumeration
    phase: network
    freeform_args_field: flags
    default_for_task: false
    llm_hints: |
      Escape hatch — pass nmap flags in flags= or additional_args=.
      target= is required; flags default to safe connect scan if omitted.
    parameters:
      target: { type: string, required: true }
      flags: { type: string, required: false, default: "-sT -Pn --unprivileged", description: "Nmap flag string" }
      privileged: { type: bool, default: false }

  enum4linux_scan:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: true
    parameters:
      target: { type: string, required: true }
      additional_args: { type: string, default: "-a" }

  enum4linux_ng_advanced:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      shares: { type: bool, default: true }
      users: { type: bool, default: true }

  smbmap_scan:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      username: { type: string, default: "" }
      password: { type: string, default: "" }

  netexec_scan:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      protocol: { type: string, default: smb }

  nbtscan_netbios:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: |
      Requires a literal IPv4 — use RESOLVED_IP from context, not the hostname.
    parameters:
      target: { type: string, required: true, description: "IPv4 address (not hostname)" }

  arp_scan_discovery:
    task: port_discovery
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: Local network only.
    parameters:
      target: { type: string, required: true }

  autorecon_scan:
    task: service_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: Heavy automated bundle — use when narrower scans are insufficient.
    parameters:
      target: { type: string, required: true }
      output_dir: { type: string, default: "/tmp/autorecon" }

  autorecon_comprehensive:
    task: service_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      output_dir: { type: string, default: "/tmp/autorecon" }

  rpcclient_enumeration:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    parameters:
      target: { type: string, required: true }
      commands: { type: string, default: "enumdomusers;enumdomgroups;querydominfo" }

  responder_credential_harvest:
    task: smb_enumeration
    phase: network
    freeform_args_field: additional_args
    default_for_task: false
    llm_hints: GATED — requires allow_exploitation in engagement RoE.
    parameters:
      interface: { type: string, default: eth0 }
      analyze: { type: bool, default: false }
