# Advisory playbooks only — the LLM may follow, edit, or ignore.
# platform_playbook returns these as suggestions; nothing auto-executes.

playbooks:
  web_recon_light:
    phase: recon
    description: >
      Lightweight web attack-surface pass: widen (sisters + subs), probe live HTTP,
      then selective depth. Adapt if volume is huge (chunk httpx; use jobs).
    input: domain
    steps:
      - tool: domain_hunter
        why: Sister/affiliate roots early — expansion instinct, not optional fluff.
        suggested_params:
          domain: "{{target}}"
          confidence_min: medium
        fallback: [whois_lookup, amass_scan]
      - tool: subfinder_scan
        why: Passive subdomain inventory (prefer typed tool or platform_exec).
        suggested_params:
          domain: "{{target}}"
          silent: true
        fallback: [amass_scan, crt_sh_query, platform_shell]
      - tool: httpx_probe
        why: Confirm which hosts speak HTTP(S) and grab titles/tech — batch/parallel.
        suggested_params:
          target: "{{from_prior_subdomains}}"
        fallback: [platform_script, platform_fanout_assets]
      - tool: nuclei
        why: Selective CVE/templates on live hosts only — not the whole internet.
        note: Use platform_shell 'nuclei -u …' if no nuclei wrapper in recon set.
        suggested_params:
          target: "{{live_hosts}}"
        fallback: [platform_shell]

  network_crown_jewels:
    phase: network
    description: >
      Fast ports then careful service confirm on crown-jewel hosts/IPs.
      Chunk ports; avoid full -sV on huge ranges (timeouts).
    input: target
    steps:
      - tool: rustscan_fast_scan
        why: Quick open-port discovery before deep nmap.
        suggested_params:
          target: "{{target}}"
        fallback: [masscan_high_speed, nmap_syn_scan]
      - tool: nmap_syn_scan
        why: Confirm top ports with TCP connect (-sT --unprivileged in this lab).
        suggested_params:
          target: "{{target}}"
          ports: "{{from_rustscan_or_top100}}"
        fallback: [nmap_service_scan, platform_shell]
      - tool: nmap_service_scan
        why: Banner/service on a SMALL port set only (chunk to avoid MCP timeout).
        suggested_params:
          target: "{{target}}"
          ports: "{{few_interesting_ports}}"
        fallback: [platform_shell]

  dns_deep:
    phase: recon
    description: >
      DNS depth beyond subfinder — records, zone edges, fierce/dnsenum when needed.
    input: domain
    steps:
      - tool: platform_shell
        why: dig NS/MX/TXT/A individually (container DNS quirks).
        suggested_params:
          command: "dig +short NS {{target}}"
        fallback: [whois_lookup]
      - tool: whois_lookup
        why: Registrar / org context for sister-domain pivots.
        suggested_params:
          domain: "{{target}}"
        fallback: [platform_shell]
      - tool: amass_scan
        why: Deeper passive intel if subfinder inventory looks thin.
        suggested_params:
          domain: "{{target}}"
        fallback: [dnsenum_scan, fierce_scan]
      - tool: dnsenum_scan
        why: Classic DNS enum when passive sources stall.
        suggested_params:
          domain: "{{target}}"
        fallback: [fierce_scan]

  smb_followup:
    phase: network
    description: When 445 is open — enum shares/users carefully.
    input: target
    steps:
      - tool: enum4linux_ng_advanced
        why: Broad SMB/Windows enum.
        suggested_params:
          target: "{{target}}"
        fallback: [enum4linux_scan, netexec_scan]
      - tool: smbmap_scan
        why: Share listing / permissions.
        suggested_params:
          target: "{{target}}"
        fallback: [netexec_scan]

  web_depth_before_vuln:
    phase: recon
    description: >
      Exhaust app depth on crown-jewel live hosts BEFORE mass nuclei/vuln scanning.
      Clear js_surface_unanalyzed / content_discovery_thin / web_surface_no_app_depth.
      Advisory only — adapt to evidence; do not treat as a rigid stage machine.
    input: domain
    steps:
      - tool: platform_context
        why: Read coverage gaps + crown jewels; list what is still shallow.
        fallback: [platform_crown_jewels]
      - tool: gau_discovery
        why: Historical paths (helps but does not replace JS/dir depth).
        suggested_params:
          domain: "{{target}}"
        fallback: [waybackurls_discovery]
      - tool: platform_script
        why: >
          On SPA/Angular/React hosts — fetch HTML, collect script src, download
          chunk/main bundles, extract /api routes and embedded keys; record
          findings with tags js_bundle / embedded_api_key.
        fallback: [katana_crawl, hakrawler_crawl]
      - tool: ffuf_scan
        why: Light directory discovery on 3–5 crown jewels only (not whole inventory).
        suggested_params:
          target: "{{crown_jewel_https}}"
        fallback: [gobuster_scan, platform_script]
      - tool: platform_finalize_check
        why: Confirm app-depth gaps cleared before COMPLETE or broad vuln scan.
        fallback: [platform_findings]

  osint_passive_footprint:
    phase: osint
    description: >
      Passive people/identity footprint. Seed from the target website, harvest
      public sources, then RECURSIVELY pivot every name/email/username/phone found.
      Public sources only — no breach data, no active probing.
    input: domain
    steps:
      - tool: web_contact_harvest
        why: Seed — pull emails, phones, social links and names straight off the site.
        suggested_params:
          url: "{{target}}"
          depth: 1
        fallback: [theharvester]
      - tool: theharvester
        why: Widen with search-engine / CT / OSINT harvest (emails, names, hosts).
        suggested_params:
          domain: "{{target}}"
        fallback: [web_contact_harvest]
      - tool: metagoofil
        why: Public documents → run exiftool_extract for author/software/GPS (more names).
        suggested_params:
          domain: "{{target}}"
        fallback: [platform_script]
      - tool: email_permute
        why: For each discovered PERSON, generate candidate emails to confirm.
        suggested_params:
          name: "{{from_prior_person}}"
          domain: "{{target}}"
        fallback: [theharvester]
      - tool: holehe
        why: For each email (found or candidate) — which sites hold an account (existence only).
        suggested_params:
          email: "{{from_prior_email}}"
        fallback: [platform_script]
      - tool: maigret
        why: For each username/handle — sweep social/web sites; extract linked profiles.
        suggested_params:
          username: "{{from_prior_username}}"
        fallback: [sherlock, social_analyzer]
      - tool: phoneinfoga
        why: For each phone number — carrier/country/footprint.
        suggested_params:
          phone: "{{from_prior_phone}}"
        fallback: [platform_script]
      - tool: dnstwist
        why: Look-alike / typosquat domains (brand abuse, phishing infra).
        suggested_params:
          domain: "{{target}}"
        fallback: [domain_hunter]

  vuln_scan_web:
    phase: vuln
    description: >
      Turn a live web host + known tech into confirmed, severity-rated findings.
      Scan by evidence (tech, parameters) — not blind fan-out. Exploitation is a
      separate, approval-gated phase; stop at proof.
    input: url
    steps:
      - tool: nuclei_scan
        why: Recon→vuln workhorse — CVE/misconfig templates on the live host. Signal first.
        suggested_params:
          target: "{{live_host_url}}"
          severity: "critical,high"
        fallback: [jaeles_vulnerability_scan, platform_shell]
      - tool: nikto_scan
        why: Web-server misconfig / dangerous files / missing headers baseline.
        suggested_params:
          target: "{{live_host_url}}"
        fallback: [nuclei_scan]
      - tool: wpscan_analyze
        why: If tech fingerprinting flagged WordPress — core/plugin/theme CVEs.
        note: Only when WordPress detected. Add --api-token via additional_args for full vuln data.
        suggested_params:
          url: "{{live_host_url}}"
        fallback: [nuclei_scan]
      - tool: sqlmap_scan
        why: Confirm SQLi on an injection_point_candidate from recon (scope permitting).
        note: Detection only — dumping/os-shell is exploitation, needs approval.
        suggested_params:
          url: "{{injection_point_url}}"
        fallback: [platform_shell]
      - tool: dalfox_xss_scan
        why: Verify XSS on recon's parameters — trust verified (type V), treat leads as follow-ups.
        suggested_params:
          url: "{{injection_point_url}}"
        fallback: [platform_shell]
