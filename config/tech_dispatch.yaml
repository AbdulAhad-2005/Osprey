# Tech/signal dispatch for recon + network (reactive pattern, config-driven).
# Commander reads active signals from graph + findings and gets task suggestions.

phase: recon_network

signals:
  - id: few_subdomains
    match:
      finding_type: subdomain
      max_count: 5
    dispatch:
      task_id: subdomain_enumeration
      default_tool: amass_scan
      alternatives: [fierce_scan, dnsenum_scan]
      skill_file: recon/subdomain-enumeration.md
      reason: "Thin subdomain set — escalate enumeration depth"
      priority: 8

  - id: live_hosts_found
    match:
      finding_type: url
      min_count: 1
    dispatch:
      task_id: historical_url_discovery
      default_tool: waybackurls_discovery
      alternatives: [gau_discovery]
      skill_file: recon/historical-url-discovery.md
      reason: "Live hosts found — mine historical URLs"
      priority: 5

  - id: live_host_content_discovery
    match:
      finding_type: url
      min_count: 1
    dispatch:
      task_id: content_discovery
      default_tool: feroxbuster_scan
      alternatives: [ffuf_scan, gobuster_scan]
      skill_file: recon/content-and-js-recon.md
      reason: "Live host — brute-force hidden paths/files (content discovery)"
      priority: 6

  - id: live_host_js_recon
    match:
      finding_type: url
      min_count: 1
    dispatch:
      task_id: javascript_analysis
      default_tool: js_recon
      alternatives: [katana_crawl]
      skill_file: recon/javascript-recon.md
      reason: "Live app host — mine its JavaScript for endpoints, secrets and cloud refs"
      priority: 6

  - id: live_host_policy_files
    match:
      finding_type: url
      min_count: 1
    dispatch:
      task_id: policy_file_discovery
      default_tool: well_known_probe
      reason: "Live host — check robots.txt / sitemap / .well-known for surface + policy leads"
      priority: 4

  - id: domain_email_posture
    match:
      finding_type: subdomain
      min_count: 1
    dispatch:
      task_id: email_security_posture
      default_tool: email_security_probe
      reason: "Domain in scope — assess SPF/DKIM/DMARC anti-spoofing posture"
      priority: 3

  - id: params_found_probe_hidden
    match:
      finding_type: url
      min_count: 3
    dispatch:
      task_id: parameter_discovery
      default_tool: arjun_scan
      alternatives: [katana_crawl]
      skill_file: recon/content-and-js-recon.md
      reason: "URLs/endpoints known — discover hidden parameters (injection-point candidates)"
      priority: 5

  - id: technology_wordpress
    match:
      metadata_key: technology
      metadata_contains: wordpress
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      additional_args: "-path /wp-json/wp/v2/users -status-code"
      reason: "WordPress detected — probe wp-json users"
      priority: 7

  - id: port_445_open
    match:
      metadata_key: port
      metadata_value: "445"
    dispatch:
      task_id: smb_enumeration
      default_tool: enum4linux_scan
      alternatives: [smbmap_scan, netexec_scan]
      skill_file: network/smb-enumeration.md
      reason: "Port 445 open — SMB enumeration"
      priority: 9

  - id: port_139_open
    match:
      metadata_key: port
      metadata_value: "139"
    dispatch:
      task_id: smb_enumeration
      default_tool: enum4linux_scan
      skill_file: network/smb-enumeration.md
      reason: "NetBIOS port 139 open"
      priority: 8

  - id: open_ports_without_service
    match:
      finding_type: port
      min_count: 1
      missing_finding_type: service
    dispatch:
      task_id: service_enumeration
      default_tool: nmap_service_scan
      alternatives: [nmap_syn_scan]
      skill_file: network/service-enumeration.md
      reason: "Open ports known — run service/version scan"
      priority: 9

  - id: shared_hosting_pivot
    match:
      graph_query: siblings_same_ip
      min_siblings: 2
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      reason: "Multiple hosts on same IP — probe siblings (defacement check)"
      priority: 10

  - id: cdn_hint_seen
    match:
      metadata_key: waf
      metadata_contains: cloudflare
    dispatch:
      task_id: cdn_origin_clues
      default_tool: cdn_origin_probe
      alternatives: [dnsx_resolve, tlsx_inspect]
      skill_file: recon/ip-attribution.md
      reason: "CDN/WAF signal — soft origin clues before heavy port scans on edges"
      priority: 7

  - id: cdn_provider_hint
    match:
      metadata_key: cdn_provider
      metadata_contains: cloud
    dispatch:
      task_id: cdn_origin_clues
      default_tool: dnsx_resolve
      alternatives: [tlsx_inspect, cdn_origin_probe]
      skill_file: recon/ip-attribution.md
      reason: "CDN provider metadata present — resolve carefully; avoid scanning edges first"
      priority: 6

  - id: ips_resolved_reverse_dns
    match:
      finding_type: host
      metadata_key: ip
      min_count: 1
    dispatch:
      task_id: reverse_dns_lookup
      default_tool: dnsx_reverse
      alternatives: [dnsx_resolve]
      skill_file: recon/asset-discovery-breadth.md
      reason: "IPs resolved — reverse-DNS (PTR) to surface co-located vhosts as new seeds"
      priority: 5

  - id: ips_resolved_asn_scope
    match:
      finding_type: host
      metadata_key: ip
      min_count: 1
    dispatch:
      task_id: asn_netblock_enumeration
      default_tool: asn_enum
      alternatives: [whois_lookup]
      skill_file: recon/asset-discovery-breadth.md
      reason: "IPs known — map ASN/netblock to expand scope to the org's IP range (skip cloud-provider ranges)"
      priority: 4

  # --- Recon → Vulnerability-analysis handoff (advisory) ---
  - id: tech_known_nuclei_scan
    match:
      finding_type: technology
      min_count: 1
    dispatch:
      task_id: vulnerability_scan
      default_tool: nuclei_scan
      alternatives: [jaeles_vulnerability_scan, nikto_scan]
      skill_file: vuln/nuclei-scanning.md
      reason: "Tech fingerprinted on live hosts — nuclei can now scan for version/CVE-specific issues"
      priority: 5

  - id: wordpress_cms_vuln
    match:
      metadata_key: technology
      metadata_contains: wordpress
    dispatch:
      task_id: cms_vulnerability_scan
      default_tool: wpscan_analyze
      alternatives: [nuclei_scan]
      skill_file: vuln/cms-and-server-scanning.md
      reason: "WordPress detected — enumerate core/plugin/theme CVEs with wpscan"
      priority: 7

  - id: graphql_endpoint_found
    match:
      metadata_key: url
      metadata_contains: graphql
    dispatch:
      task_id: graphql_security_scan
      default_tool: graphql_cop_scan
      alternatives: [nuclei_scan]
      skill_file: web/graphql-testing.md
      reason: "GraphQL endpoint discovered — audit introspection / batching / CSRF with graphql-cop"
      priority: 5

  - id: spa_framework_render
    match:
      metadata_key: technology
      metadata_contains: react
    dispatch:
      task_id: spa_render_scrape
      default_tool: browser_scrape
      alternatives: [katana_crawl]
      skill_file: web/browser-automation.md
      reason: "SPA framework detected — render in a real browser to capture client-side routes + XHR APIs static crawlers miss"
      priority: 5

  - id: https_tls_deep_scan
    match:
      has_tag: tls
      min_count: 1
    dispatch:
      task_id: tls_configuration_scan
      default_tool: sslyze_scan
      alternatives: [nuclei_scan]
      skill_file: vuln/tls-configuration.md
      reason: "HTTPS host with a TLS cert — deep-scan protocols/ciphers/CVEs (WSTG-CRYP, always safe)"
      priority: 3

  - id: server_misconfig_nikto
    match:
      finding_type: technology
      min_count: 1
    dispatch:
      task_id: web_server_scan
      default_tool: nikto_scan
      alternatives: [nuclei_scan]
      skill_file: vuln/cms-and-server-scanning.md
      reason: "Live web server fingerprinted — nikto for dangerous files / missing headers / dated software (pairs with nuclei templates)"
      priority: 4

  - id: php_stack_injection_focus
    match:
      metadata_key: technology
      metadata_contains: php
    dispatch:
      task_id: sql_injection_test
      default_tool: sqlmap_scan
      alternatives: [nuclei_scan]
      skill_file: vuln/injection-testing.md
      reason: "PHP stack — prioritise SQLi/LFI testing on its parameters (classic injection surface)"
      priority: 3

  - id: injection_point_candidates
    match:
      has_tag: injection_point_candidate
      min_count: 1
    dispatch:
      task_id: sql_injection_test
      default_tool: sqlmap_scan
      alternatives: [dalfox_xss_scan]
      skill_file: vuln/injection-testing.md
      reason: "Hidden parameters found in recon — test them for SQLi/XSS (scope permitting)"
      priority: 4

  - id: recon_complete_handoff
    match:
      phases_complete: [subdomain_enumeration, live_host_probing]
      has_live_hosts: true
    dispatch:
      task_id: port_discovery
      default_tool: rustscan_fast_scan
      skill_file: network/port-scan-strategy.md
      reason: "Recon baseline done — begin network port discovery on live hosts"
      priority: 6

  # --- Adaptive depth (config-driven, no target hardcoding) ---
  - id: many_urls_thin_history
    match:
      finding_type: url
      min_count: 3
    dispatch:
      task_id: historical_url_discovery
      default_tool: waybackurls_discovery
      alternatives: [gau_discovery]
      reason: "Several live URLs — mine historical paths before calling recon done"
      priority: 8

  - id: technology_express_or_nodejs
    match:
      metadata_key: technology
      metadata_contains: express
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      alternatives: [platform_script]
      reason: "Express/Node signal — probe APIs, debug endpoints, alt ports (e.g. 8443)"
      priority: 7

  - id: technology_apache
    match:
      metadata_key: technology
      metadata_contains: apache
    dispatch:
      task_id: content_discovery
      default_tool: platform_script
      alternatives: [ffuf_scan, gobuster_scan]
      reason: "Apache live — light content discovery / interesting paths"
      priority: 6

  # --- Technology Identification follow-ups ---

  - id: technology_joomla
    match:
      metadata_key: technology
      metadata_contains: joomla
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      additional_args: "-path /administrator/ -status-code"
      reason: "Joomla detected — probe admin panel and check for known CVEs"
      priority: 7

  - id: technology_drupal
    match:
      metadata_key: technology
      metadata_contains: drupal
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      additional_args: "-path /CHANGELOG.txt -status-code"
      reason: "Drupal detected — check changelog exposure and Drupalgeddon"
      priority: 7

  - id: technology_laravel
    match:
      metadata_key: technology
      metadata_contains: laravel
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      additional_args: "-path /.env -status-code"
      reason: "Laravel detected — check .env exposure and Ignition RCE"
      priority: 8

  - id: technology_react_or_vue
    match:
      metadata_key: technology
      metadata_contains_any: [react, vue, angular, next, nuxt, svelte]
    dispatch:
      task_id: javascript_analysis
      default_tool: js_recon
      alternatives: [katana_crawl]
      skill_file: recon/content-and-js-recon.md
      reason: "SPA framework — the real API surface is in the JS bundles; run js_recon"
      priority: 7

  - id: technology_iis_old
    match:
      metadata_key: technology
      metadata_contains: microsoft-iis
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      additional_args: "-path /web.config -status-code"
      reason: "IIS detected — check for web.config exposure and known IIS CVEs"
      priority: 7

  - id: technology_cloudflare_cdn
    match:
      metadata_key: technology
      metadata_contains: cloudflare
    dispatch:
      task_id: cdn_origin_clues
      default_tool: cdn_origin_probe
      alternatives: [origin_ip_attribution]
      skill_file: recon/ip-attribution.md
      reason: "Cloudflare CDN detected — look for origin IP bypass"
      priority: 7

  - id: technology_analytics_detected
    match:
      metadata_key: technology
      metadata_contains_any: [google-analytics, google-tag-manager, hotjar]
    dispatch:
      task_id: technology_identification
      default_tool: whatweb_scan
      reason: "Analytics detected — run deeper tech fingerprinting for full stack"
      priority: 4

  # --- Passive OSINT recursive pivots (the "dig into what you find" loop) ---
  # Each identity finding suggests the next passive lookup. All public-source only.

  - id: osint_person_found
    match:
      finding_type: person
      min_count: 1
    dispatch:
      task_id: email_pattern_generation
      default_tool: email_permute
      alternatives: [maigret, theharvester]
      skill_file: osint/email-people-harvest.md
      reason: "Person discovered — generate candidate emails (email_permute) and search their username (maigret)"
      priority: 7

  - id: osint_email_found
    match:
      finding_type: email
      min_count: 1
    dispatch:
      task_id: email_account_discovery
      default_tool: holehe
      skill_file: osint/email-people-harvest.md
      reason: "Email discovered — enumerate account existence with holehe (no breach data)"
      priority: 7

  - id: osint_username_found
    match:
      finding_type: username
      min_count: 1
    dispatch:
      task_id: username_enumeration
      default_tool: maigret
      alternatives: [sherlock, social_analyzer]
      skill_file: osint/username-pivot.md
      reason: "Username discovered — sweep social/web sites for matching accounts"
      priority: 6

  - id: osint_phone_found
    match:
      finding_type: phone
      min_count: 1
    dispatch:
      task_id: phone_number_osint
      default_tool: phoneinfoga
      reason: "Phone number discovered — profile carrier/country/footprint"
      priority: 5

  - id: osint_document_found
    match:
      finding_type: document
      min_count: 1
    dispatch:
      task_id: document_metadata_discovery
      default_tool: exiftool_extract
      skill_file: osint/document-metadata.md
      reason: "Public document found — extract author/software/GPS metadata (feeds PERSON leads)"
      priority: 5

  - id: osint_social_account_found
    match:
      finding_type: social_account
      min_count: 1
    dispatch:
      task_id: username_enumeration
      default_tool: maigret
      alternatives: [social_analyzer]
      skill_file: osint/username-pivot.md
      reason: "Social account found — pivot its handle across other platforms"
      priority: 5
