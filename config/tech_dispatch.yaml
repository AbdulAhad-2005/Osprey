# Tech/signal dispatch for recon + network (Dark-Moon reactive pattern, config-driven).
# Commander reads active signals from graph + findings and gets task suggestions.

phase: recon_network

signals:
  - id: few_subdomains
    match:
      finding_type: subdomain
      max_count: 5
    dispatch:
      task_id: subdomain_enumeration
      default_tool: amass_scan
      alternatives: [fierce_scan, dnsenum_scan]
      skill_file: recon/subdomain-enumeration.md
      reason: "Thin subdomain set — escalate enumeration depth"
      priority: 8

  - id: live_hosts_found
    match:
      finding_type: url
      min_count: 1
    dispatch:
      task_id: historical_url_discovery
      default_tool: waybackurls_discovery
      alternatives: [gau_discovery]
      skill_file: recon/historical-url-discovery.md
      reason: "Live hosts found — mine historical URLs"
      priority: 5

  - id: technology_wordpress
    match:
      metadata_key: technology
      metadata_contains: wordpress
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      additional_args: "-path /wp-json/wp/v2/users -status-code"
      reason: "WordPress detected — probe wp-json users"
      priority: 7

  - id: port_445_open
    match:
      metadata_key: port
      metadata_value: "445"
    dispatch:
      task_id: smb_enumeration
      default_tool: enum4linux_scan
      alternatives: [smbmap_scan, netexec_scan]
      skill_file: network/smb-enumeration.md
      reason: "Port 445 open — SMB enumeration"
      priority: 9

  - id: port_139_open
    match:
      metadata_key: port
      metadata_value: "139"
    dispatch:
      task_id: smb_enumeration
      default_tool: enum4linux_scan
      skill_file: network/smb-enumeration.md
      reason: "NetBIOS port 139 open"
      priority: 8

  - id: open_ports_without_service
    match:
      finding_type: port
      min_count: 1
      missing_finding_type: service
    dispatch:
      task_id: service_enumeration
      default_tool: nmap_service_scan
      alternatives: [nmap_syn_scan]
      skill_file: network/service-enumeration.md
      reason: "Open ports known — run service/version scan"
      priority: 9

  - id: shared_hosting_pivot
    match:
      graph_query: siblings_same_ip
      min_siblings: 2
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      reason: "Multiple hosts on same IP — probe siblings (defacement check)"
      priority: 10

  - id: cdn_hint_seen
    match:
      metadata_key: waf
      metadata_contains: cloudflare
    dispatch:
      task_id: cdn_origin_clues
      default_tool: cdn_origin_probe
      alternatives: [dnsx_resolve, tlsx_inspect]
      skill_file: recon/ip-attribution.md
      reason: "CDN/WAF signal — soft origin clues before heavy port scans on edges"
      priority: 7

  - id: cdn_provider_hint
    match:
      metadata_key: cdn_provider
      metadata_contains: cloud
    dispatch:
      task_id: cdn_origin_clues
      default_tool: dnsx_resolve
      alternatives: [tlsx_inspect, cdn_origin_probe]
      skill_file: recon/ip-attribution.md
      reason: "CDN provider metadata present — resolve carefully; avoid scanning edges first"
      priority: 6

  - id: recon_complete_handoff
    match:
      phases_complete: [subdomain_enumeration, live_host_probing]
      has_live_hosts: true
    dispatch:
      task_id: port_discovery
      default_tool: rustscan_fast_scan
      skill_file: network/port-scan-strategy.md
      reason: "Recon baseline done — begin network port discovery on live hosts"
      priority: 6

  # --- Adaptive depth (config-driven, no target hardcoding) ---
  - id: many_urls_thin_history
    match:
      finding_type: url
      min_count: 3
    dispatch:
      task_id: historical_url_discovery
      default_tool: waybackurls_discovery
      alternatives: [gau_discovery]
      reason: "Several live URLs — mine historical paths before calling recon done"
      priority: 8

  - id: technology_express_or_nodejs
    match:
      metadata_key: technology
      metadata_contains: express
    dispatch:
      task_id: live_host_probing
      default_tool: httpx_probe
      alternatives: [platform_script]
      reason: "Express/Node signal — probe APIs, debug endpoints, alt ports (e.g. 8443)"
      priority: 7

  - id: technology_apache
    match:
      metadata_key: technology
      metadata_contains: apache
    dispatch:
      task_id: content_discovery
      default_tool: platform_script
      alternatives: [ffuf_scan, gobuster_scan]
      reason: "Apache live — light content discovery / interesting paths"
      priority: 6
