# Parallelism — help the operator go wide without freezing the chat.
# Config owns caps + "often long" tool names. The LLM chooses when to branch.
# Never auto-start jobs from this file.
#
# These values are honoured as set — there is no silent clamp. A sanity
# ceiling exists only to catch a fat-fingered value (see _SANITY_CEILINGS in
# parallelism_config.py): max_running_jobs/max_running_agents <= 200,
# agent_spawn_budget <= 5000, max_spawn_depth <= 50,
# suggest_job_timeout_seconds <= 3600. Exceeding one logs a warning naming
# the enforced ceiling instead of silently substituting a different number.

max_running_jobs: 4
suggest_job_timeout_seconds: 120

# Tool names that often deserve a background branch (soft hint only).
# Add/remove here — do not hardcode chains in AGENTS.
long_tools:
  - amass_scan
  - dnsenum_scan
  - fierce_scan
  - nmap_syn_scan
  - nmap_service_scan
  - nmap_custom_scan
  - rustscan_fast_scan
  - masscan_high_speed
  - httpx_probe
  - dnsx_resolve
  - crt_sh_query
  - nuclei_scan
  - ffuf_scan
  - gobuster_scan
  - domain_hunter

# Open-gap thresholds (data, not "must fanout")
batch_probe_min_hosts: 8
batch_probe_min_subdomains: 20
