# Universal stdout → finding promotion. Applies to EVERY tool/script/shell.
# New tools inherit these rules automatically — add patterns here, don't fork code.
# Config owns patterns. The LLM owns interpretation, relations, and next probes.

rules:
  - id: vendor_fingerprint_header
    pattern: '(?i)(?:^|\n)((?:X-[A-Z0-9-]{3,40}|Server|X-Powered-By):\s*[^\n]{3,120})'
    finding_type: technology
    evidence_grade: observed
    claim_severity: medium
    title_template: "HTTP fingerprint header: {match}"
    tags: [auto_ingest, banner, product_hint]

  - id: cors_star
    pattern: '(?i)Access-Control-Allow-Origin:\s*\*'
    finding_type: observation
    evidence_grade: observed
    claim_severity: medium
    title_template: "CORS Allow-Origin: * observed"
    tags: [auto_ingest, cors]

  - id: open_port_line
    pattern: '(?i)(\d{1,5})/(tcp|udp)\s+open(?:\s+(\S+))?'
    finding_type: port
    evidence_grade: inferred
    claim_severity: info
    title_template: "Open port {g1}/{g2} {g3}"
    tags: [auto_ingest, port]

  - id: spa_catchall_suspect
    pattern: '(?i)(<!DOCTYPE html|<div id=["'']root["'']|ng-version=|__NEXT_DATA__)'
    finding_type: observation
    evidence_grade: unverified
    claim_severity: info
    title_template: "SPA/HTML shell body — do not treat path as open API without JSON proof"
    tags: [auto_ingest, spa_catchall_suspect]
    require_path_hint: true
    path_hint_pattern: '(?i)/(api|swagger|graphql|rest)(/|$|\?)'

  - id: json_api_body
    pattern: '(?i)^\s*[\{\[][\s\S]{20,}("users"|"data"|"items"|"token"|"access")'
    finding_type: observation
    evidence_grade: observed
    claim_severity: high
    title_template: "JSON API-shaped body with sensitive keys"
    tags: [auto_ingest, api_json]

  - id: console_or_app_path
    pattern: '(?i)(/(?:console|manager|login|admin|owa|ecp|OA_HTML|AppsLocalLogin|frmservlet)[^\s"'']{0,60})'
    finding_type: url
    evidence_grade: observed
    claim_severity: medium
    title_template: "Console/app path indicator: {match}"
    tags: [auto_ingest, console_path, product_hint]

  - id: subdomain_line
    pattern: '(?i)^(?:\*\.)?([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+)\s*$'
    finding_type: subdomain
    evidence_grade: inferred
    claim_severity: info
    title_template: "{g1}"
    tags: [auto_ingest, subdomain]
    multiline: true

  # --- Phase 3 expansions (YAML only — no AGENTS bullets per pattern) ---

  - id: http_status_title
    pattern: '(?i)(?:^|\n)(?:https?://\S+\s+)?\[?(\d{3})\]?\s+[^\n]{0,40}?\[([^\]]{2,80})\]'
    finding_type: observation
    evidence_grade: observed
    claim_severity: info
    title_template: "HTTP {g1} title: {g2}"
    tags: [auto_ingest, http_title]

  - id: httpx_status_line
    pattern: '(?i)(https?://[^\s]+)\s+\[(\d{3})\](?:\s+\[([^\]]{1,80})\])?'
    finding_type: url
    evidence_grade: observed
    claim_severity: info
    title_template: "{g1} [{g2}] {g3}"
    tags: [auto_ingest, http_probe, http_title]

  - id: www_authenticate
    pattern: '(?i)(WWW-Authenticate:\s*[^\n]{3,160})'
    finding_type: observation
    evidence_grade: observed
    claim_severity: medium
    title_template: "Auth challenge: {match}"
    tags: [auto_ingest, auth_challenge, product_hint]

  - id: set_cookie_domain
    pattern: '(?i)Set-Cookie:\s*([^\n]{5,200})'
    finding_type: observation
    evidence_grade: observed
    claim_severity: info
    title_template: "Set-Cookie: {match}"
    tags: [auto_ingest, cookie, auth_surface]

  - id: location_redirect
    pattern: '(?i)(?:^|\n)((?:Location|location):\s*https?://[^\s\n]{5,200})'
    finding_type: observation
    evidence_grade: observed
    claim_severity: info
    title_template: "Redirect: {match}"
    tags: [auto_ingest, redirect]

  - id: redirect_chain_marker
    pattern: '(?i)(?:redirect(?:ed|s|ion)?\s*(?:to|→|->|:)\s*|final[_ -]?url[=:]\s*)(https?://[^\s\n]{5,200})'
    finding_type: url
    evidence_grade: inferred
    claim_severity: info
    title_template: "Redirect target: {g1}"
    tags: [auto_ingest, redirect]

  - id: tls_san_or_cn
    pattern: '(?i)(?:DNS:|subject(?:AltName)?[=:]|CN\s*=\s*|commonName\s*=\s*)([a-z0-9*.-]{3,120})'
    finding_type: observation
    evidence_grade: inferred
    claim_severity: info
    title_template: "TLS name hint: {g1}"
    tags: [auto_ingest, tls, cert_name]

  - id: certificate_issuer
    pattern: '(?i)(?:issuer[=:]\s*|i:\s*)([^\n]{5,160})'
    finding_type: observation
    evidence_grade: inferred
    claim_severity: info
    title_template: "TLS issuer: {g1}"
    tags: [auto_ingest, tls, cert_issuer]

  - id: version_banner
    pattern: '(?i)((?:SSH|OpenSSH|FTP|SMTP|MySQL|PostgreSQL|Redis|MongoDB|Apache|nginx|IIS)[^\n]{0,80}(?:version|/|\s)\s*[\w.()-]{2,40})'
    finding_type: technology
    evidence_grade: observed
    claim_severity: medium
    title_template: "Service banner: {match}"
    tags: [auto_ingest, banner, version]

  - id: nmap_service_version
    # [ \t] (not \s) between every token so the 4th group can never cross a
    # newline — \s matches \n, and when nmap has no inline version (a plain
    # "80/tcp open  http" line, common whenever -sV didn't fingerprint it)
    # this rule was grabbing the *next line* instead — usually an NSE script
    # result like "|_http-title: ..." — producing a garbage "service" finding
    # whose title was really two unrelated lines concatenated. Same bug class
    # already fixed once below for tech_version_line; never applied here.
    pattern: '(?i)(\d{1,5})/(tcp|udp)[ \t]+open[ \t]+(\S+)[ \t]+([^\n]{3,100})'
    finding_type: service
    evidence_grade: observed
    claim_severity: info
    title_template: "Service {g1}/{g2} {g3}: {g4}"
    tags: [auto_ingest, service, banner]

  - id: json_content_type
    pattern: '(?i)(Content-Type:\s*application/json[^\n]*)'
    finding_type: observation
    evidence_grade: observed
    claim_severity: info
    title_template: "JSON content-type: {match}"
    tags: [auto_ingest, api_json, content_type]

  - id: js_route_hint
    pattern: '(?i)["''`](/(?:api|rest|v[0-9]+|graphql|backend)[/a-z0-9_\-{}:.]{2,80})["''`]'
    finding_type: url
    evidence_grade: inferred
    claim_severity: info
    title_template: "JS route hint: {g1}"
    tags: [auto_ingest, js_route, app_depth]

  # --- Technology Identification (WhatWeb/Wappalyzer/tech_stack) ---

  - id: whatweb_technology
    pattern: '(?i)"technology"\s*:\s*"([^"]+)".*?"version"\s*:\s*"([^"]*)"'
    finding_type: technology
    evidence_grade: observed
    claim_severity: info
    title_template: "Technology detected: {g1} {g2}"
    tags: [auto_ingest, technology, fingerprint]
    multiline: true

  - id: wappalyzer_category
    pattern: '(?i)"categories"\s*:\s*\[([^\]]{3,120})\]'
    finding_type: technology
    evidence_grade: inferred
    claim_severity: info
    title_template: "Tech category: {g1}"
    tags: [auto_ingest, technology, wappalyzer]
    multiline: true

  - id: whatweb_plugin_name
    pattern: '(?i)"plugins"\s*:\s*\{[^}]*"([A-Z][a-zA-Z0-9]+)"\s*:\s*\{'
    finding_type: technology
    evidence_grade: observed
    claim_severity: info
    title_template: "WhatWeb plugin: {g1}"
    tags: [auto_ingest, technology, whatweb]
    multiline: true

  - id: security_concern_line
    pattern: '(?i)(?:security_concern|concern|follow_up)[^:]*:\s*(.{10,200})'
    finding_type: observation
    evidence_grade: inferred
    claim_severity: medium
    title_template: "Security concern: {g1}"
    tags: [auto_ingest, security_concern, tech_analysis]

  - id: tech_version_line
    # [ \t] (not \s) between tokens so the match can't cross a newline —
    # \s matches \n, which previously let this rule read a table header
    # like nmap's "PORT STATE SERVICE VERSION" on one line and the port
    # number on the next as a fake "SERVICE 80" technology finding.
    pattern: '(?i)([a-zA-Z][a-zA-Z0-9._-]{2,30})[ \t]*(?:version|v)[ \t]*[:=]?[ \t]*([\d.]{2,20})'
    finding_type: technology
    evidence_grade: inferred
    claim_severity: info
    title_template: "Version detected: {g1} {g2}"
    tags: [auto_ingest, technology, version]
