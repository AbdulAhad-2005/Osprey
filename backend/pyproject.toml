[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osprey-backend"
version = "0.1.0"
description = "Backend services for the autonomous AI pentesting platform"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.3,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "litellm>=1.50,<2.0",
    "orjson>=3.9,<4.0",
    "pyyaml>=6.0,<7.0",
    # SSE streaming for POST /api/v1/agent/chat/stream (the CLI live view).
    "sse-starlette>=2.1,<4.0",
    # Public-suffix aware apex-domain extraction — whois_lookup._strip_to_apex
    # falls back to a heuristic without it, mishandling multi-part ccTLDs
    # (e.g. nadra.gov.pk → gov.pk). Bundles an offline PSL snapshot.
    "tldextract>=5.0,<6.0",
    # Authoritative-nameserver DNS queries — the surface-expansion engine's
    # second source for "does this name resolve" (dead-candidate gate): public
    # resolvers returning nothing is not proof of death, and dnspython can ask
    # the zone's own NS directly (dig @<NS> semantics) without a dig binary.
    "dnspython>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.2,<9.0",
    "ruff>=0.6,<1.0",
]
# LiteLLM cannot call gemini/* models (the default provider) without the Google SDK. 
# Docker installs it already; for a native install using Gemini, run
# `pip install -e ./backend[gemini]` (or switch LLM_MODEL to another provider).
gemini = [
    "google-generativeai>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["osprey*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
