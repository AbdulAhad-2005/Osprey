[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentest-cli"
version = "0.1.0"
description = "CLI interface for the Autonomous AI Pentesting Platform"
requires-python = ">=3.12"
dependencies = [
    "prompt_toolkit>=3.0,<4.0",
    "httpx>=0.27,<1.0",
    "rich>=13.0,<14.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
pentest = "cli.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*"]
